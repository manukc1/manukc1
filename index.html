<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Файл с телефона по QR</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#fff;--fg:#1c1b1a;--mut:#6b6761;--card:#f4f2ee;--acc:#2a6df4;--ok:#1f9d55}
@media(prefers-color-scheme:dark){:root{--bg:#1a1918;--fg:#f0eeea;--mut:#a09b94;--card:#262422}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:20px}
h1{font-size:22px;margin:0 0 14px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px}
#qr{display:block;margin:0 auto;background:#fff;padding:10px;border-radius:10px;max-width:100%}
.st{font-size:14px;color:var(--mut);text-align:center;margin-top:10px}
.st b{color:var(--ok)}
.big{display:block;width:100%;padding:16px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.big:disabled{opacity:.45}
.item{padding:10px 0;border-top:1px solid var(--bg)}
.item:first-child{border-top:0}
.item a{display:inline-block;margin-top:6px;padding:6px 12px;border-radius:8px;background:var(--ok);color:#fff;text-decoration:none}
.n{word-break:break-all;font-weight:600}
small{color:var(--mut)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Файл с телефона по QR</h1>

<section id="pc" hidden>
  <div class="card">
    <canvas id="qr" width="240" height="240"></canvas>
    <div class="st" id="pcSt">Создаю QR…</div>
  </div>
  <div class="card" id="listCard" hidden><div id="list"></div></div>
  <small>Получив файл, не открывайте его, если не ждали его от себя: QR может отсканировать кто угодно рядом.</small>
</section>

<section id="ph" hidden>
  <div class="card">
    <div class="st" id="phSt" style="margin:0 0 12px">Подключение к компьютеру…</div>
    <button class="big" id="pick" disabled>Выбрать файл</button>
    <input type="file" id="file" hidden>
    <div class="st" id="phInfo"></div>
  </div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const fmt=b=>b>1048576?(b/1048576).toFixed(1)+' МБ':Math.ceil(b/1024)+' КБ';
const target=new URLSearchParams(location.search).get('id');

function drawQR(text){
  const q=qrcode(0,'M');q.addData(text);q.make();
  const c=$('qr'),n=q.getModuleCount(),s=Math.floor(c.width/(n+4)),ctx=c.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#000';
  const off=Math.floor((c.width-s*n)/2);
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))ctx.fillRect(off+x*s,off+y*s,s,s);
}

if(!target){
  /* ---- компьютер: принимает ---- */
  $('pc').hidden=false;
  const id='qrx-'+Math.random().toString(36).slice(2,10);
  const peer=new Peer(id);
  peer.on('open',()=>{
    drawQR(location.origin+location.pathname+'?id='+id);
    $('pcSt').textContent='Наведите камеру телефона на QR-код';
  });
  peer.on('error',e=>{$('pcSt').textContent='Ошибка: '+e.type;});
  peer.on('connection',conn=>{
    conn.on('open',()=>{$('pcSt').innerHTML='<b>Телефон подключён</b> — выберите файл на нём';});
    conn.on('data',d=>{
      if(!d||!d.data)return;
      const blob=new Blob([d.data],{type:d.type||'application/octet-stream'});
      const row=document.createElement('div');row.className='item';
      const n=document.createElement('div');n.className='n';n.textContent=d.name+' ('+fmt(d.size)+')';
      const a=document.createElement('a');a.textContent='Сохранить';
      a.href=URL.createObjectURL(blob);a.download=d.name;
      row.append(n,a);$('list').prepend(row);$('listCard').hidden=false;
      $('pcSt').innerHTML='<b>Файл получен</b>';
      conn.send({ok:true});
    });
  });
}else{
  /* ---- телефон: отправляет ---- */
  $('ph').hidden=false;
  const peer=new Peer();
  let conn=null;
  peer.on('open',()=>{
    conn=peer.connect(target,{reliable:true});
    conn.on('open',()=>{$('phSt').innerHTML='<b>Подключено</b>';$('pick').disabled=false;});
    conn.on('data',d=>{if(d&&d.ok)$('phInfo').textContent='Файл доставлен ✔';});
    conn.on('close',()=>{$('phSt').textContent='Соединение закрыто';$('pick').disabled=true;});
  });
  peer.on('error',e=>{$('phSt').textContent=e.type==='peer-unavailable'?'Компьютер не найден — обновите QR на компьютере':'Ошибка: '+e.type;});
  $('pick').onclick=()=>$('file').click();
  $('file').onchange=async()=>{
    const f=$('file').files[0];if(!f||!conn)return;
    if(f.size>50*1048576){$('phInfo').textContent='Файл больше 50 МБ — слишком много для этого способа';return;}
    $('phInfo').textContent='Отправка: '+f.name+'…';
    conn.send({name:f.name,type:f.type,size:f.size,data:await f.arrayBuffer()});
    $('file').value='';
  };
}
</script>
</body>
</html>
